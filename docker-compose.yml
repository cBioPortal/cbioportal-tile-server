---
# Quick start:
#
#   python3 tools/write_dev_env.py          # securely write .env from local credentials
#   docker compose up --build
#
# Or: cp .env.example .env  then fill in credentials manually.

services:

  tile-server:
    build: .
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      # ── Dell ECS / S3 connection ──────────────────────────────────────────
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

      # ── WSI capability authentication ────────────────────────────────────
      WSI_AUTH_SECRET: ${WSI_AUTH_SECRET:?WSI_AUTH_SECRET must be set}
      WSI_AUTH_AUDIENCE: ${WSI_AUTH_AUDIENCE:-cbioportal-wsi}
      WSI_AUTH_MAX_TTL: ${WSI_AUTH_MAX_TTL:-300}
      WSI_ALLOWED_SOURCE_SCHEMES: ${WSI_ALLOWED_SOURCE_SCHEMES:-s3}
      CACHE_MISS_RATE_LIMIT_PER_MINUTE: ${CACHE_MISS_RATE_LIMIT_PER_MINUTE:-1200}
      # ── Databricks / thumbnail namespace (dev overrides only) ───────────
      WSI_THUMBNAIL_REGISTRY_TABLE: ${WSI_THUMBNAIL_REGISTRY_TABLE:-cdsi_prod.pathology_data_mining.slide_thumbnail_registry}
      WSI_CANONICAL_ASSOCIATION_TABLE: ${WSI_CANONICAL_ASSOCIATION_TABLE:-cdsi_prod.pathology_data_mining.canonical_slide_associations}
      WSI_SUMMARY_TABLE: ${WSI_SUMMARY_TABLE:-cdsi_prod.pathology_data_mining.sample_wsi_summary}
      WSI_STAIN_CLASSIFICATION_TABLE: ${WSI_STAIN_CLASSIFICATION_TABLE:-cdsi_prod.pathology_data_mining.slide_stain_classification}
      THUMBNAIL_MANIFEST_URI: ${THUMBNAIL_MANIFEST_URI:-}

      # ── Tile settings ─────────────────────────────────────────────────────
      TILE_SIZE: ${TILE_SIZE:-256}
      JPEG_QUALITY: ${JPEG_QUALITY:-85}
      MAX_DECODE_PIXELS: ${MAX_DECODE_PIXELS:-16777216}
      THUMBNAIL_MAX_DECODE_PIXELS: ${THUMBNAIL_MAX_DECODE_PIXELS:-16777216}

      # ── Redis cache ───────────────────────────────────────────────────────
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
      REDIS_CONNECT_TIMEOUT_SECONDS: ${REDIS_CONNECT_TIMEOUT_SECONDS:-0.25}
      REDIS_COMMAND_TIMEOUT_SECONDS: ${REDIS_COMMAND_TIMEOUT_SECONDS:-0.25}
      REDIS_FAILURE_BACKOFF_SECONDS: ${REDIS_FAILURE_BACKOFF_SECONDS:-5}
      TILE_CACHE_TTL: ${TILE_CACHE_TTL:-86400}
      THUMBNAIL_CACHE_TTL: ${THUMBNAIL_CACHE_TTL:-86400}
      CACHE_MISS_LOCK_TTL_SECONDS: ${CACHE_MISS_LOCK_TTL_SECONDS:-120}
      CACHE_MISS_WAIT_TIMEOUT_SECONDS: ${CACHE_MISS_WAIT_TIMEOUT_SECONDS:-60}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-180}

      # ── CORS — add the viewer origin so the browser can reach tile APIs ───
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:3000,https://cbioportal.mskcc.org,https://triage.cbioportal.mskcc.org}

      # ── OncoKB — register at oncokb.org/account/settings to get a token ──
      ONCOKB_API_TOKEN: ${ONCOKB_API_TOKEN:-}

      # ── Annotation API ────────────────────────────────────────────────────
      ANNOTATION_DATABASE_URL: ${ANNOTATION_DATABASE_URL:-}
      ANNOTATION_DB_PATH: /data/annotations.db
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:-}
      ANNOTATION_AUTH_ENABLED: ${ANNOTATION_AUTH_ENABLED:-true}
      # Dev-only compatibility for seeded rows when cBioPortal uses its
      # synthetic local-development capability subject.
      ANNOTATION_LOCAL_DEVELOPMENT: ${ANNOTATION_LOCAL_DEVELOPMENT:-false}

      # ── Optional WSI research assistant (server-side only) ───────────────
      # Keep the API credential in a secret-mounted file or secret manager;
      # never expose it to the browser or commit it to this repository.
      WSI_AGENT_ENABLED: ${WSI_AGENT_ENABLED:-false}
      WSI_AGENT_PROVIDER: ${WSI_AGENT_PROVIDER:-bedrock}
      BEDROCK_AGENT_MODEL: ${BEDROCK_AGENT_MODEL:-us.anthropic.claude-sonnet-4-5-20250929-v1:0}
      BEDROCK_AWS_REGION: ${BEDROCK_AWS_REGION:-us-east-1}
      BEDROCK_AWS_PROFILE: ${BEDROCK_AWS_PROFILE:-}
      BEDROCK_AWS_ENDPOINT_URL: ${BEDROCK_AWS_ENDPOINT_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
      OPENAI_API_KEY_FILE: ${OPENAI_API_KEY_FILE:-}
      WSI_AGENT_TIMEOUT_SECONDS: ${WSI_AGENT_TIMEOUT_SECONDS:-60}
      WSI_AGENT_RATE_LIMIT_PER_MINUTE: ${WSI_AGENT_RATE_LIMIT_PER_MINUTE:-10}
      WSI_RESEARCH_ENABLED: ${WSI_RESEARCH_ENABLED:-false}
      WSI_RESEARCH_MANIFEST_URI: ${WSI_RESEARCH_MANIFEST_URI:-}
      WSI_RESEARCH_RATE_LIMIT_PER_MINUTE: ${WSI_RESEARCH_RATE_LIMIT_PER_MINUTE:-30}
      WSI_RESEARCH_EMBEDDING_URL: ${WSI_RESEARCH_EMBEDDING_URL:-}
      WSI_RESEARCH_EMBEDDING_TIMEOUT_SECONDS: ${WSI_RESEARCH_EMBEDDING_TIMEOUT_SECONDS:-60}
      WSI_RESEARCH_STATIC_FALLBACK: ${WSI_RESEARCH_STATIC_FALLBACK:-true}

      # ── Capacity (tune to host RAM; each open SVS ≈ 50–200 MB) ───────────
      MAX_OPEN_SLIDES: ${MAX_OPEN_SLIDES:-1}
      N_WORKERS: ${N_WORKERS:-2}
      MAX_IMAGE_OPERATIONS: ${MAX_IMAGE_OPERATIONS:-2}

      # ── fsspec BlockCache — point at a fast local disk (NVMe preferred) ──
      # The named volume above keeps cold SVS range reads local between
      # requests. Set BLOCKCACHE_PATH empty explicitly to disable it.
      BLOCKCACHE_PATH: ${BLOCKCACHE_PATH:-/cache/slide-blocks}
      BLOCKCACHE_BLOCK_SIZE: ${BLOCKCACHE_BLOCK_SIZE:-8388608}   # 8 MB
      BLOCKCACHE_MAX_BYTES: ${BLOCKCACHE_MAX_BYTES:-19327352832} # 18 GiB of 20 GiB volume
      BLOCKCACHE_PRUNE_INTERVAL_SECONDS: ${BLOCKCACHE_PRUNE_INTERVAL_SECONDS:-60}
      PROMETHEUS_MULTIPROC_DIR: ${PROMETHEUS_MULTIPROC_DIR:-/cache/prometheus}
    volumes:
      - slide_blocks:/cache/slide-blocks
      - annotation_data:/data
      - ./tests/testdata:/app/testdata:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${APP_MEMORY_LIMIT:-4g}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Optional profile: start with `docker compose --profile research up`.
  # Keeping this out of the default stack prevents the large ML runtime from
  # consuming tile-server memory when semantic search is not enabled.
  quiltnet-search:
    build:
      context: .
      dockerfile: Dockerfile.quiltnet
    profiles: ["research"]
    environment:
      NVIDIA_VISIBLE_DEVICES: ${QUILTNET_GPU:-0}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      BEDROCK_AWS_REGION: ${BEDROCK_AWS_REGION:-us-east-1}
      WSI_RESEARCH_EMBEDDING_CACHE_DIR: /cache/research-embeddings
      QUILTNET_MODEL_NAME: ${QUILTNET_MODEL_NAME:-hf-hub:wisdomik/QuiltNet-B-16-PMB}
      QUILTNET_DEVICE: ${QUILTNET_DEVICE:-auto}
      HF_HOME: /cache/huggingface
    volumes:
      - research_embeddings:/cache/research-embeddings
      - research_model_cache:/cache/huggingface
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: ${RESEARCH_WORKER_MEMORY_LIMIT:-4g}
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7.4.5-alpine
    command: >
      redis-server
      --maxmemory ${REDIS_MAXMEMORY:-1g}
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
      --requirepass ${REDIS_PASSWORD:-}
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  redis_data:
  slide_blocks:      # default named volume for BlockCache (override with host mount for NVMe)
  annotation_data:   # persistent SQLite annotation database
  research_embeddings:
  research_model_cache:
