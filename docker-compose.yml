---
# Quick start:
#
#   python3 tools/write_dev_env.py          # securely write .env from local credentials
#   docker compose up --build
#
# Or: cp .env.example .env  then fill in credentials manually.

services:

  tile-server:
    build: .
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      # ── Dell ECS / S3 connection ──────────────────────────────────────────
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

      # ── WSI capability authentication ────────────────────────────────────
      WSI_AUTH_SECRET: ${WSI_AUTH_SECRET:?WSI_AUTH_SECRET must be set}
      WSI_AUTH_AUDIENCE: ${WSI_AUTH_AUDIENCE:-cbioportal-wsi}
      WSI_AUTH_MAX_TTL: ${WSI_AUTH_MAX_TTL:-300}
      WSI_ALLOWED_SOURCE_SCHEMES: ${WSI_ALLOWED_SOURCE_SCHEMES:-s3}
      # Keep the online service on the same de-identification boundary as the
      # study-file exporter. Every deployment must provide both allowlists.
      WSI_ALLOWED_SOURCE_PREFIXES: ${WSI_ALLOWED_SOURCE_PREFIXES:?WSI_ALLOWED_SOURCE_PREFIXES must be set}
      WSI_ALLOWED_THUMBNAIL_PREFIXES: ${WSI_ALLOWED_THUMBNAIL_PREFIXES:?WSI_ALLOWED_THUMBNAIL_PREFIXES must be set}
      CACHE_MISS_RATE_LIMIT_PER_MINUTE: ${CACHE_MISS_RATE_LIMIT_PER_MINUTE:-1200}
      # ── Databricks / thumbnail namespace (dev overrides only) ───────────
      WSI_THUMBNAIL_REGISTRY_TABLE: ${WSI_THUMBNAIL_REGISTRY_TABLE:-cdsi_prod.pathology_data_mining.slide_thumbnail_registry}
      WSI_CANONICAL_ASSOCIATION_TABLE: ${WSI_CANONICAL_ASSOCIATION_TABLE:-cdsi_prod.pathology_data_mining.canonical_slide_associations}
      WSI_SUMMARY_TABLE: ${WSI_SUMMARY_TABLE:-cdsi_prod.pathology_data_mining.sample_wsi_summary}
      WSI_STAIN_CLASSIFICATION_TABLE: ${WSI_STAIN_CLASSIFICATION_TABLE:-cdsi_prod.pathology_data_mining.slide_stain_classification}
      THUMBNAIL_MANIFEST_URI: ${THUMBNAIL_MANIFEST_URI:-}

      # ── Tile settings ─────────────────────────────────────────────────────
      TILE_SIZE: ${TILE_SIZE:-256}
      JPEG_QUALITY: ${JPEG_QUALITY:-85}
      MAX_DECODE_PIXELS: ${MAX_DECODE_PIXELS:-16777216}
      THUMBNAIL_MAX_DECODE_PIXELS: ${THUMBNAIL_MAX_DECODE_PIXELS:-16777216}

      # ── Redis cache ───────────────────────────────────────────────────────
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
      REDIS_CONNECT_TIMEOUT_SECONDS: ${REDIS_CONNECT_TIMEOUT_SECONDS:-0.25}
      REDIS_COMMAND_TIMEOUT_SECONDS: ${REDIS_COMMAND_TIMEOUT_SECONDS:-0.25}
      REDIS_FAILURE_BACKOFF_SECONDS: ${REDIS_FAILURE_BACKOFF_SECONDS:-5}
      TILE_CACHE_TTL: ${TILE_CACHE_TTL:-86400}
      THUMBNAIL_CACHE_TTL: ${THUMBNAIL_CACHE_TTL:-86400}
      CACHE_MISS_LOCK_TTL_SECONDS: ${CACHE_MISS_LOCK_TTL_SECONDS:-120}
      CACHE_MISS_WAIT_TIMEOUT_SECONDS: ${CACHE_MISS_WAIT_TIMEOUT_SECONDS:-60}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-180}

      # ── CORS — add the viewer origin so the browser can reach tile APIs ───
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:3000,https://cbioportal.mskcc.org,https://triage.cbioportal.mskcc.org}

      # ── Capacity (tune to host RAM; each open SVS ≈ 50–200 MB) ───────────
      MAX_OPEN_SLIDES: ${MAX_OPEN_SLIDES:-1}
      N_WORKERS: ${N_WORKERS:-2}
      MAX_IMAGE_OPERATIONS: ${MAX_IMAGE_OPERATIONS:-2}

      # ── fsspec BlockCache — point at a fast local disk (NVMe preferred) ──
      # The named volume above keeps cold SVS range reads local between
      # requests. Set BLOCKCACHE_PATH empty explicitly to disable it.
      BLOCKCACHE_PATH: ${BLOCKCACHE_PATH:-/cache/slide-blocks}
      BLOCKCACHE_BLOCK_SIZE: ${BLOCKCACHE_BLOCK_SIZE:-8388608}   # 8 MB
      BLOCKCACHE_MAX_BYTES: ${BLOCKCACHE_MAX_BYTES:-19327352832} # 18 GiB of 20 GiB volume
      BLOCKCACHE_PRUNE_INTERVAL_SECONDS: ${BLOCKCACHE_PRUNE_INTERVAL_SECONDS:-60}
      PROMETHEUS_MULTIPROC_DIR: ${PROMETHEUS_MULTIPROC_DIR:-/cache/prometheus}
    volumes:
      - slide_blocks:/cache/slide-blocks
      - ./tests/testdata:/app/testdata:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${APP_MEMORY_LIMIT:-4g}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  redis:
    image: redis:7.4.5-alpine
    command: >
      redis-server
      --maxmemory ${REDIS_MAXMEMORY:-1g}
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
      --requirepass ${REDIS_PASSWORD:-}
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  redis_data:
  slide_blocks:  # default named volume for BlockCache (override with host mount for NVMe)
