name: PostgreSQL integration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tile_server
          POSTGRES_PASSWORD: tile_server
          POSTGRES_DB: tile_server_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tile_server -d tile_server_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.8.22"

      - name: Install locked development environment
        run: uv sync --dev --frozen

      - name: Run PostgreSQL integration suite
        env:
          POSTGRES_TEST_DSN: postgresql://tile_server:tile_server@127.0.0.1:5432/tile_server_test
        run: uv run pytest -m integration tests/test_postgres_integration.py
