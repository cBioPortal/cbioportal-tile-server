bundle:
  name: cbioportal-tile-server

# Databricks Asset Bundle — legacy/offline SQL definitions. Production table
# ownership and scheduling moved to ../pdm_databricks_pipelines. Keep this
# bundle paused so two jobs cannot publish competing canonical snapshots.
# Deploy:   databricks bundle deploy
# Run once: databricks bundle run wsi-summary-pipeline
# Destroy:  databricks bundle destroy

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://msk-mode-prod.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://msk-mode-prod.cloud.databricks.com

resources:
  jobs:
    wsi-summary-pipeline:
      name: "[${bundle.target}] WSI Summary Pipeline"
      description: >
        Nightly job that first materializes the canonical patient/sample/slide
        association universe and then derives the sample summary table used by
        cBioPortal ingestion and access APIs.

      schedule:
        quartz_cron_expression: "0 0 3 * * ?"
        timezone_id: UTC
        pause_status: PAUSED

      tasks:
        - task_key: ensure-stain-classification-table
          description: Ensure the approved offline stain-classification release table exists
          sql_task:
            warehouse_id: "0b49b7d78734ad5c"
            file:
              path: tools/stain_classification_schema.sql
              source: WORKSPACE

        - task_key: compute-canonical-associations
          description: Run wsi_canonical_associations_pipeline.sql on serverless compute
          depends_on:
            - task_key: ensure-stain-classification-table
          sql_task:
            warehouse_id: "0b49b7d78734ad5c"
            file:
              path: tools/wsi_canonical_associations_pipeline.sql
              source: WORKSPACE

        - task_key: compute-wsi-summary
          description: Run wsi_summary_pipeline.sql on serverless compute
          depends_on:
            - task_key: compute-canonical-associations
          sql_task:
            warehouse_id: "0b49b7d78734ad5c"
            file:
              path: tools/wsi_summary_pipeline.sql
              source: WORKSPACE

      email_notifications:
        on_failure:
          - limr@mskcc.org

      max_concurrent_runs: 1
